name: Publish reviewed atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check application and energy calculations
        run: |
          node --check app.js
          node --check workspace.js
          node --check registry-workspace.js
          node --check parcel-identity.js
          node --check identity-evidence.js
          node --check investigation-view.js
          node --check city-data-client.js
          node --check city-workspace.js
          node --check property-workbench.js
          node --check atlas-selections.js
          node --check property-comparison.js
          node scripts/check-atlas-selections.cjs
          node scripts/check-property-comparison.cjs
          node --check municipal-explorer.js
          node --check municipal-data-client.js
          node --check connected-property-view.js
          node --check property-evidence-cases.js
          node --check evidence-labels.js
          node --check parcel-overview.js
          node scripts/check-energy.cjs
          node scripts/check-identity-evidence.cjs
          node scripts/check-city-static.cjs
          node scripts/check-municipal-static.cjs
          node scripts/check-evidence-labels.cjs
      - name: Validate source-only city, municipal and evidence release
        run: python3 scripts/check_atlas_release_sources.py
      - name: Validate additional source context and investigation
        run: |
          python3 scripts/check_property_release.py
          node --check property-investigation.js
          node --check refinement-evidence.js
          node scripts/check-property-investigation.cjs
          node scripts/check-refinement-evidence.cjs
          node scripts/check-atlas-render-cache.cjs
      - name: Validate civic-to-parcel navigation and access sources
        run: |
          node --check access-resolution.js
          python3 scripts/check_access_publication.py
          node scripts/check-access-resolution.cjs
      - name: Build allowlisted public artifact
        run: python3 scripts/build_public_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
